name: Sync from Google Sheets

# Copies the data-entry Google Sheet into cldf/*.csv. If the data passes
# build.py's checks and anything changed, commits it and redeploys the site.
# If a check fails, nothing is committed and the run fails with the error list.

on:
  schedule:
    # Three times an hour: GitHub delays and drops scheduled runs (the single hourly slot ran
    # 5 to 10 hours apart, 20-23 Nov 2026), and a run that finds nothing new costs half a minute.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SHEET_ID: ${{ vars.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Download the sheet into cldf/
        run: python tools/sync_sheet.py "$SHEET_ID" --out cldf
      - name: Check the data (and refresh STATUS.md)
        run: python build.py --check --status STATUS.md
      - name: Check Glottocodes and ISO codes against Glottolog
        run: python tools/check_glottolog.py
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- cldf STATUS.md; then
            echo "No changes in the sheet."
            # Safety net: if no deploy of this commit finished or is under way (one was cancelled), ask for one.
            sha=$(git rev-parse HEAD)
            live=$(gh run list --workflow pages.yml --branch main --limit 30 --json headSha,event,status,conclusion \
              --jq "[.[] | select(.headSha == \"$sha\" and .event != \"pull_request\" and (.status != \"completed\" or .conclusion == \"success\"))] | length")
            if [ "$live" = "0" ]; then
              echo "No finished deploy of $sha: redeploying."
              gh workflow run pages.yml --ref main
            fi
            exit 0
          fi
          git diff --stat -- cldf STATUS.md
          git config user.name "sheet-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cldf STATUS.md
          if git diff --cached --quiet -- cldf; then MSG="Refresh STATUS.md"; else MSG="Sync data from Google Sheets"; fi
          git commit -m "$MSG"
          git push
          # A deploy queued while another is running has been cancelled twice (22 Nov 2026), which left
          # the site one commit behind: wait for running deploys to finish before asking for this one.
          for i in $(seq 1 40); do
            busy=$(gh run list --workflow pages.yml --json status --jq '[.[] | select(.status != "completed")] | length')
            [ "$busy" = "0" ] && break
            sleep 15
          done
          gh workflow run pages.yml --ref main
